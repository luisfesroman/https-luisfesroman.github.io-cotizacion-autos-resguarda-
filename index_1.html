<title>Cotización Autos Resguarda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna centrada (≤680px) — barra de marca fija, una carretera donde el auto avanza por cada paso,
   una tarjeta de paso a la vez y, al final, la solicitud impresa como ticket listo para WhatsApp. */
:root{
  --navy:#1A3A6B; --orange:#E87722; --orange-ink:#B5530E;
  --bg:#F1F4F9; --surface:#FFFFFF; --field:#F7F9FC; --ink:#14223B; --muted:#5A6880; --line:#DCE3EE;
  --primary:#1A3A6B; --on-primary:#FFFFFF; --brand-ink:#1A3A6B; --tint:#E8EEF8; --orange-tint:#FDF0E4;
  --asphalt:#2A3852; --lane:#F4C38E; --glass:#C3D6F3; --tire:#0F1625; --hub:#C9D2E0;
  --ok:#1B8452; --warn:#9A6210; --err:#C0391B; --wa:#15803D;
  --shadow:0 1px 2px rgba(20,34,59,.06),0 10px 28px rgba(20,34,59,.08);
  --gnp-filter:none;
  --f-ui:'Montserrat',"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#121D31; --field:#0E1829; --ink:#E6ECF5; --muted:#97A4BA; --line:#24324C;
    --primary:#3B69B6; --on-primary:#FFFFFF; --brand-ink:#A9C2EE; --tint:#18284A; --orange-tint:#2C1E12; --orange-ink:#F39A55;
    --asphalt:#23314A; --lane:#E2B176; --glass:#7193C9; --tire:#05080F; --hub:#AEB9CC;
    --ok:#3DBF7F; --warn:#E3A640; --err:#F27A5E; --wa:#1E9E52;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    --gnp-filter:brightness(0) invert(1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#121D31; --field:#0E1829; --ink:#E6ECF5; --muted:#97A4BA; --line:#24324C;
  --primary:#3B69B6; --on-primary:#FFFFFF; --brand-ink:#A9C2EE; --tint:#18284A; --orange-tint:#2C1E12; --orange-ink:#F39A55;
  --asphalt:#23314A; --lane:#E2B176; --glass:#7193C9; --tire:#05080F; --hub:#AEB9CC;
  --ok:#3DBF7F; --warn:#E3A640; --err:#F27A5E; --wa:#1E9E52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --gnp-filter:brightness(0) invert(1);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.02em}

/* ---------- Barra de marca ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:36px;width:auto;display:block}
.word{line-height:1}
.word b{display:block;font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--brand-ink)}
.word span{display:block;font-size:8.5px;letter-spacing:.42em;color:var(--orange-ink);font-weight:700;margin-top:3px}
.gnp{height:26px;width:auto;filter:var(--gnp-filter);opacity:.92}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}

/* ---------- Carretera de avance ---------- */
.road{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 6px;box-shadow:var(--shadow)}
.road-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);font-weight:600;padding:2px 2px 0}
.road-head strong{color:var(--ink);font-weight:700}
.track-wrap{padding-inline:28px 44px}
.track{position:relative;height:76px}
.asphalt{position:absolute;left:-30px;right:-46px;top:32px;height:20px;border-radius:10px;background:var(--asphalt);overflow:hidden}
.lane{position:absolute;left:0;right:0;top:9px;height:2px;background:repeating-linear-gradient(90deg,var(--lane) 0 12px,transparent 12px 24px)}
.road.moving .lane{animation:lane .9s linear}
@keyframes lane{to{background-position:-96px 0}}
.stop{position:absolute;top:36px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;border:2px solid var(--hub);background:var(--asphalt);padding:0;cursor:default;transition:background .3s,border-color .3s}
.stop.done{background:var(--orange);border-color:var(--orange);cursor:pointer}
.stop.reach{cursor:pointer}
.stop-label{position:absolute;top:57px;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none;transition:color .3s}
.stop-label.cur{color:var(--ink);font-weight:800}
.flag{position:absolute;top:6px;width:20px;height:30px;pointer-events:none}
.car{position:absolute;top:14px;width:54px;height:29px;transform:translateX(-50%);transition:left .9s cubic-bezier(.55,.05,.25,1);z-index:2;pointer-events:none}
.car svg{display:block;width:100%;height:100%;overflow:visible}
.car-body{fill:var(--orange)}
.car-glass{fill:var(--glass)}
.car-light{fill:#FFE6A8}
.car-tail{fill:#D8361B}
.tire{fill:var(--tire)}
.hub{fill:var(--hub)}
.spoke{stroke:var(--tire);stroke-width:1.4}
.wheel{transform-box:fill-box;transform-origin:center}
.road.moving .wheel{animation:spin .3s linear 3}
.road.moving .car svg{animation:bob .3s ease-in-out 3}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-1px)}}
@media (max-width:560px){.stop-label:not(.cur){display:none}}

/* ---------- Tarjetas de paso ---------- */
.panel{position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px 20px}
.enter-fwd{animation:inR .42s cubic-bezier(.2,.7,.2,1) both}
.enter-back{animation:inL .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phase{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:10.5px;letter-spacing:.1em}
.phase.cot{background:var(--orange-tint);color:var(--orange-ink)}
.phase.emi{background:var(--tint);color:var(--brand-ink)}
.phase::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:clamp(26px,6.4vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.02em;color:var(--brand-ink)}
h1 em{font-style:normal;color:var(--orange-ink)}
h2{font-size:clamp(21px,5vw,25px);line-height:1.2;font-weight:800;letter-spacing:-.01em;margin-top:8px}
.sub{color:var(--muted);margin:6px 0 0;max-width:56ch}

form.fields{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;margin:0;padding:0}
.field > label,.field > legend{font-weight:700;font-size:13.5px;padding:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%}
.field .opt{font-weight:500;color:var(--muted);font-size:12px}
.ctl{position:relative}
.ctl input,.ctl select{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);padding:0 44px 0 14px;font-size:16px;font-weight:500;transition:border-color .2s,box-shadow .2s,background .2s;appearance:none;-webkit-appearance:none}
.ctl select{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.ctl input::placeholder{color:var(--muted);opacity:.6;font-weight:400}
.ctl input:focus,.ctl select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--tint);background:var(--surface)}
.ctl input.mono{text-transform:uppercase;font-family:var(--f-mono);letter-spacing:.06em}
.ctl input.mono::placeholder{text-transform:none}
.tick{position:absolute;right:13px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--ok);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.ctl select ~ .tick{right:36px}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .1s}
.field.valid .tick{transform:scale(1)}
.field.valid .tick svg{stroke-dashoffset:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.msg{font-size:12.5px;font-weight:600;margin:0;color:var(--err)}
.msg:empty{display:none}
.msg.warn{color:var(--warn)}
.field.invalid .ctl input,.field.invalid .ctl select{border-color:var(--err)}
.field.invalid.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
:root[data-theme="dark"] .linkbtn{color:var(--brand-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .linkbtn{color:var(--brand-ink)}}

.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);font-weight:600;font-size:14px;transition:background .2s,border-color .2s,color .2s}
.chip span::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);transition:all .2s}
.chip input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary);animation:pop .3s}
.chip input:checked + span::before{background:var(--orange);border-color:var(--orange)}
.chip input:focus-visible + span{outline:3px solid var(--orange);outline-offset:2px}
.chip:hover span{border-color:var(--primary)}
@keyframes pop{40%{transform:scale(.94)}75%{transform:scale(1.04)}}
.field.invalid:not(.other-err) .chip span{border-color:var(--err)}
.field.other-err > .chipset .chip span{border-color:var(--line)}
.reveal{animation:drop .3s ease both}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn.off{opacity:.45}
.btn-next{flex:1 1 180px}
.btn-next .arr{transition:transform .2s}
.btn-next:hover .arr{transform:translateX(3px)}

/* ---------- Inicio ---------- */
.hero{padding:6px 2px 0}
.hero .sub{font-size:15.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.mode:hover{transform:translateY(-3px);border-color:var(--orange)}
.mode:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.mode-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.mode-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode.cot .mode-ico{background:var(--orange-tint);color:var(--orange-ink)}
.mode.emi .mode-ico{background:var(--tint);color:var(--brand-ink)}
.count{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{font-size:20px;color:var(--ink);font-weight:800;margin-right:3px}
.mode-title{display:block;font-size:18px;font-weight:800;line-height:1.25}
.mode-desc{display:block;color:var(--muted);font-size:13.5px}
.mode .go{margin-top:auto;font-weight:700;font-size:14px;color:var(--brand-ink);display:flex;align-items:center;gap:6px}
.mode.cot .go{color:var(--orange-ink)}
.mode .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .2s}
.mode:hover .go svg{transform:translateX(4px)}

.handy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.handy h3{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.handy ul{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
@media (max-width:480px){.handy ul{grid-template-columns:1fr}}
.handy li{display:flex;gap:12px;align-items:flex-start;min-width:0}
.handy li svg{flex:none;width:34px;height:34px;padding:7px;border-radius:10px;background:var(--tint);stroke:var(--brand-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.handy b{display:block;font-size:14px}
.handy span{display:block;font-size:12.5px;color:var(--muted)}
.try{text-align:center;font-size:13px;color:var(--muted)}

/* ---------- Ticket / resumen ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--orange-tint);color:var(--orange-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ticket.print{animation:print 1s cubic-bezier(.3,.6,.2,1) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-10px)}to{clip-path:inset(0 0 0 0);transform:none}}
.t-head{background:var(--navy);color:#fff;padding:18px 20px;display:flex;gap:14px;align-items:center}
.t-head img{height:42px;width:auto;background:#fff;border-radius:10px;padding:4px}
.t-head h2{margin:0;font-size:18px;color:#fff}
.t-head p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.t-meta{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 20px;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.t-meta b{color:var(--ink)}
.t-sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.t-sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.t-sec-h h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.t-sec-h h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.t-sec-h h3 i.cot{background:var(--orange)}
.t-sec-h h3 i.emi{background:var(--primary)}
.t-sec-h h3 i.both{background:var(--muted)}
dl.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.edit{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:8px}
.edit:hover{color:var(--ink);background:var(--field)}
.edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.perf{height:18px;position:relative;background:var(--surface)}
.perf::before{content:"";position:absolute;left:14px;right:14px;top:8px;border-top:2px dashed var(--line)}
.verify{padding:6px 20px 4px;display:flex;flex-direction:column;gap:10px}
.verify h3{font-size:13px;font-weight:800}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:13.5px}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);margin:0;display:grid;place-items:center;cursor:pointer;transition:all .2s}
.check input::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{transform:rotate(45deg) scale(1)}
.actions{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.actions .row{display:flex;gap:10px;flex-wrap:wrap}
.actions .row .btn{flex:1 1 160px}
.actions .msg{text-align:center}
.okmsg{color:var(--ok);font-weight:700;font-size:13px;text-align:center;margin:0}
.okmsg:empty{display:none}
details.preview{border:1px solid var(--line);border-radius:12px;background:var(--field)}
details.preview summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:13.5px}
details.preview pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;max-height:340px;overflow:auto}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-size:13.5px}
.continue{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border-radius:var(--r);padding:16px 18px}
.continue p{margin:0;font-size:14px;font-weight:600;max-width:36ch}

footer{text-align:center;font-size:12px;color:var(--muted);padding-top:6px;display:flex;flex-direction:column;gap:2px}
footer b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===================== Catálogos ===================== */

/* ===================== Estado ===================== */

}
function saveAgent(){
  if (S.example) return;
  try { localStorage.setItem(AG_KEY, JSON.stringify({agente:S.data.agente||"", cua:S.data.cua||""})); } catch(e){}

function check(id){
  const f = FIELDS[id]; const v = (S.data[id]||"").trim();
  if (f.type === "chips"){
    if (!v) return {err:"Elige una opción."};
    if (f.other && v === f.other.when && !(S.data[f.other.id]||"").trim()) return {err:f.other.err, other:true};
    return {};
  }
  if (!v) return {err: f.type === "select" ? "Selecciona una opción." : "Este dato es obligatorio."};
  switch (f.type){
    case "cp":    return /^\d{5}$/.test(v) ? {} : {err:"Escribe los 5 dígitos del código postal."};
    case "age":   return (/^\d{1,2}$/.test(v) && +v >= 16 && +v <= 99) ? {} : {err:"Escribe una edad entre 16 y 99 años."};
    case "tel":   return digits(v).length === 10 ? {} : {err:"El celular lleva 10 dígitos (tiene " + digits(v).length + ")."};
    case "email": return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? {} : {err:"Revisa el correo, por ejemplo: nombre@correo.com"};
    case "rfc":   return /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(v) ? {} : {err:"Revisa el RFC: 3 o 4 letras, 6 números de la fecha y 3 de homoclave."};
    case "vin": {
      const w = [];
      if (v.length !== 17) w.push("tiene " + v.length + " caracteres y la serie suele llevar 17");
      if (/[IOQ]/.test(v)) w.push("la serie no usa las letras I, O ni Q (¿será 1 o 0?)");
      return w.length ? {warn:"Verifica contra la tarjeta: " + w.join("; ") + "."} : {};
    }
  }
  return {};
}
function stepFieldIds(stepKey){
  const ids = [];
  (STEPS[stepKey].fields||[]).forEach(f => (f.row||[f]).forEach(x => ids.push(x.id)));
  return ids;
}
function requiredCount(mode){
  let total = 0, done = 0;
  FLOW[mode].forEach(k => stepFieldIds(k).forEach(id => { total++; if (!check(id).err) done++; }));
  return {total, done};
}

/* ===================== Carretera ===================== */
function renderRoad(){
  const mode = S.mode || "emi";
  const flow = FLOW[mode];
  const n = flow.length;
  const track = $("#track");
  const pos = i => (n === 1 ? 0 : (i/(n-1))*100);
  let h = '<div class="asphalt"><div class="lane"></div></div>';
  flow.forEach((k,i) => {
    const done = S.idx > i, cur = S.idx === i, reach = i <= S.max && !cur;
    if (k === "resumen") h += '<div class="flag" style="left:calc(' + pos(i) + '% + 16px)">' + FLAG + '</div>';
    h += '<button type="button" class="stop' + (done?' done':'') + (reach?' reach':'') + '" style="left:' + pos(i) + '%" data-go="' + i + '"'
       + (reach ? '' : ' tabindex="-1"') + ' aria-label="' + esc(STEPS[k].label) + (cur?' (paso actual)':'') + '"' + (cur?' aria-current="step"':'') + '></button>';
    h += '<span class="stop-label' + (cur?' cur':'') + '" style="left:' + pos(i) + '%">' + esc(STEPS[k].label) + '</span>';
  });
  const carAt = pos(Math.max(0, S.idx));
  h += '<div class="car" id="car" style="left:' + (track.dataset.car || carAt) + '%">' + CAR + '</div>';
  track.innerHTML = h;
  const car = $("#car");
  const road = $("#road");
  if (String(carAt) !== String(track.dataset.car)) {
    requestAnimationFrame(() => requestAnimationFrame(() => { car.style.left = carAt + "%"; }));
    if (track.dataset.car !== undefined && !reduce) { road.classList.remove("moving"); void road.offsetWidth; road.classList.add("moving"); setTimeout(() => road.classList.remove("moving"), 950); }
    track.dataset.car = carAt;
  }
  road.setAttribute("aria-valuemax", n-1);
  road.setAttribute("aria-valuenow", Math.max(0,S.idx));
  $("#roadTitle").textContent = S.idx < 0 ? "Elige el trámite" : MODE_NAME[S.mode];
  const steps = n - 1;
  $("#roadCount").textContent = S.idx < 0 ? "" : (flow[S.idx] === "resumen" ? "Lista para enviar" : "Paso " + (S.idx+1) + " de " + steps);
}

function inputAttrs(f){
  switch (f.type){
    case "cp":    return 'inputmode="numeric" maxlength="5" autocomplete="off"';
    case "age":   return 'inputmode="numeric" maxlength="2" autocomplete="off"';
    case "tel":   return 'type="tel" inputmode="tel" maxlength="14" autocomplete="off"';
    case "email": return 'type="email" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="off"';
    case "rfc": case "vin": case "upper": return 'class="mono" autocapitalize="characters" spellcheck="false" autocomplete="off"' + (f.type==="rfc"?' maxlength="13"':'') + (f.type==="vin"?' maxlength="20"':'');
    default: return 'autocapitalize="' + (f.cap||"sentences") + '" autocomplete="off"';
  }
}
function fieldHTML(f){
  const v = S.data[f.id] || "";
  if (f.type === "chips"){
    let h = '<fieldset class="field" data-f="' + f.id + '"><legend>' + esc(f.label) + '</legend><div class="chipset" role="radiogroup">';
    f.opts.forEach((o,i) => {
      h += '<label class="chip"><input type="radio" name="' + f.id + '" id="f-' + f.id + '-' + i + '" value="' + esc(o) + '"' + (v===o?' checked':'') + '><span>' + esc(o) + '</span></label>';
    });
    h += '</div>';
    if (f.other){
      const ov = S.data[f.other.id] || "";
      h += '<div class="field other" data-other="' + f.id + '"' + (v===f.other.when?'':' hidden') + '><label for="f-' + f.other.id + '">' + esc(f.other.label) + '</label>'
        + '<div class="ctl"><input id="f-' + f.other.id + '" data-in="' + f.other.id + '" value="' + esc(ov) + '" placeholder="' + esc(f.other.ph) + '" autocapitalize="' + (f.other.cap||"sentences") + '" autocomplete="off"></div></div>';
    }
    return h + '<p class="msg" id="m-' + f.id + '"></p></fieldset>';
  }
  let ctl;
  if (f.type === "select"){
    ctl = '<select id="f-' + f.id + '" data-in="' + f.id + '"><option value="">' + esc(f.ph) + '</option>'
        + f.opts.map(o => '<option' + (o===v?' selected':'') + '>' + esc(o) + '</option>').join("") + '</select>';
  } else {
    ctl = '<input id="f-' + f.id + '" data-in="' + f.id + '" value="' + esc(v) + '" placeholder="' + esc(f.ph||"") + '" ' + inputAttrs(f) + '>';
  }
  let extra = "";
  if (f.sameAs) extra += '<button type="button" class="linkbtn" data-same="' + f.id + '" hidden></button>';
  if (f.quick) extra += '<button type="button" class="linkbtn" data-quick="' + f.id + '">' + esc(f.quick.label) + '</button>';
  return '<div class="field" data-f="' + f.id + '"><label for="f-' + f.id + '">' + esc(f.label) + '</label>'
    + '<div class="ctl">' + ctl + '<span class="tick" aria-hidden="true">' + ICON.tick + '</span></div>'
    + (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '')
    + '<p class="msg" id="m-' + f.id + '" role="status"></p>' + extra + '</div>';
}

function paint(id, force){
  const f = FIELDS[id]; const box = document.querySelector('[data-f="' + id + '"]');
  if (!box) return true;
  const r = check(id); const m = $("#m-" + id);
  const show = force || S.touched[id];
  box.classList.toggle("valid", !r.err && !!(S.data[id]||"").trim() && f.type !== "chips");
  box.classList.toggle("invalid", !!(r.err && show));
  box.classList.toggle("other-err", !!r.other);
  m.className = "msg" + (r.warn && !r.err ? " warn" : "");
  m.textContent = r.err ? (show ? r.err : "") : (r.warn || "");
  if (f.sameAs){
    const b = box.querySelector("[data-same]"); const src = S.data[f.sameAs];
    if (b){ b.hidden = !src || src === S.data[id]; b.textContent = "Usar el C.P. de la cotización (" + (src||"") + ")"; }
  }
  return !r.err;
}

/* ===================== Panel ===================== */
function render(dir){
  renderRoad();
  const panel = $("#panel");
  const anim = reduce ? "" : (dir === "back" ? "enter-back" : "enter-fwd");
  if (S.idx < 0) panel.innerHTML = '<div class="' + anim + '">' + introHTML() + '</div>';
  else {
    const key = FLOW[S.mode][S.idx];
    panel.innerHTML = '<div class="' + (key==="resumen" ? "" : anim) + '">' + (key === "resumen" ? summaryHTML() : stepHTML(key)) + '</div>';
    if (key !== "resumen"){
      stepFieldIds(key).forEach(id => paint(id));
      if (fine){ const first = stepFieldIds(key).find(id => check(id).err); const el = first && (document.getElementById("f-" + first) || document.getElementById("f-" + first + "-0")); if (el) setTimeout(() => el.focus({preventScroll:true}), 60); }
    }
  }
  if (lastIdx !== S.idx){
    const top = $("#road").getBoundingClientRect().top + scrollY - $(".bar").offsetHeight - 12;
    if (scrollY > top) scrollTo({top, behavior: reduce ? "auto" : "smooth"});
  }
  lastIdx = S.idx;
  hotSnap();
}

function stepHTML(key){

/* ===================== Resumen y mensaje ===================== */
function display(id){
  const v = (S.data[id]||"").trim();
  const f = FIELDS[id];
  if (f.type === "tel"){ const d = digits(v); return d.length===10 ? d.slice(0,3)+" "+d.slice(3,6)+" "+d.slice(6) : v; }
  if (f.type === "chips" && f.other && v === f.other.when){
    if (id === "conductorTipo") return (S.data.conductorNombre||"").trim();
    return v + ": " + (S.data[f.other.id]||"").trim();
  }
  if (id === "conductorTipo") return "No aplica";
  return v;
}

function today(){ return new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"}); }

function buildMessage(){
  const L = [];
  L.push("*SOLICITUD DE " + (S.mode === "emi" ? "COTIZACIÓN Y EMISIÓN" : "COTIZACIÓN") + " · AUTO*");
  L.push("Resguarda Consultores · " + today());
  sections().forEach(s => {
    L.push(""); L.push("*" + s.title.toUpperCase() + "*");
    s.ids.forEach(id => L.push(label(id) + ": " + display(id)));
  });
  if (S.mode === "emi" && S.ver.id && S.ver.tc){ L.push(""); L.push("_Datos verificados contra identificación y tarjeta de circulación._"); }
  if (S.example){ L.push(""); L.push("_(Datos de ejemplo, no emitir)_"); }
  return L.join("\n");
}

function refreshSummaryActions(){
  const gate = S.mode === "emi" && !(S.ver.id && S.ver.tc);
  const msg = buildMessage();
  const wa = $("#waBtn"), cp = $("#copyBtn");

  wa.href = "https://wa.me/?text=" + encodeURIComponent(msg);
  wa.classList.toggle("off", gate); cp.classList.toggle("off", gate);
  if (gate) wa.setAttribute("aria-disabled","true"); else wa.removeAttribute("aria-disabled");
  $("#msgPre").textContent = msg;
  if (!gate) $("#gateMsg").textContent = "";
}

/* ===================== Navegación ===================== */
function go(i, dir){
  S.idx = i; S.max = Math.max(S.max, i);
  if (FLOW[S.mode][i] === "resumen") saveAgent();
  render(dir);
}
function submitStep(){
  const key = FLOW[S.mode][S.idx];
  let firstBad = null;
  stepFieldIds(key).forEach(id => { S.touched[id] = true; if (!paint(id, true) && !firstBad) firstBad = id; });
  if (firstBad){
    const box = document.querySelector('[data-f="' + firstBad + '"]');
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    const f = FIELDS[firstBad];
    let el = document.getElementById("f-" + firstBad) || document.getElementById("f-" + firstBad + "-0");
    if (f.type === "chips" && f.other && S.data[firstBad] === f.other.when) el = document.getElementById("f-" + f.other.id);
    if (el) el.focus();
    box.scrollIntoView({block:"center", behavior: reduce ? "auto" : "smooth"});
    return;
  }
  go(canJump() ? FLOW[S.mode].length - 1 : S.idx + 1, "fwd");
}
function canJump(){
  const last = FLOW[S.mode].length - 1;
  return S.max >= last && FLOW[S.mode].slice(0, last).every(k => stepFieldIds(k).every(id => !check(id).err));
}
function resetAll(keepAgent){
  const ag = {agente:S.data.agente, cua:S.data.cua};
  S = { mode:null, idx:-1, max:-1, data: keepAgent ? ag : {}, touched:{}, example:false, ver:{id:false,tc:false}, confirmReset:false };
  if (!keepAgent) loadAgent();
  render("back");
}
const EXAMPLE = {
  marca:"Nissan", version:"Versa Advance CVT 1.6L", modelo:"2024", procedencia:"Nacional", cpCot:"81200", edad:"35", genero:"Femenino",
  nombre:"Mariana López Ejemplo", rfc:"LOEM900315AB1", celular:"6681234567", correo:"cliente@ejemplo.com",
  direccion:"Blvd. Ejemplo 123, Col. Centro", municipio:"Ahome", estado:"Sinaloa", cpEmi:"81200",
  serie:"3N1CN8AE5RK000001", motor:"HR16000001", placas:"VXX-000-A", paquete:"Amplia", pago:"Anual", conductorTipo:"No, es el mismo",
  agente:"Agente de Ejemplo", cua:"000000"
};

/* ===================== Eventos ===================== */
const panel = $("#panel");
panel.addEventListener("input", e => {
  const id = e.target.dataset.in;
  if (!id) return;
  const f = FIELDS[id];
  let v = e.target.value;
  if (f && (f.type === "rfc" || f.type === "vin" || f.type === "upper")) v = v.toUpperCase();
  if (f && (f.type === "cp" || f.type === "age")){ const d = digits(v); if (d !== v){ e.target.value = d; v = d; } }
  S.data[id] = v;
  if (f) paint(id);
  else { const parent = Object.values(FIELDS).find(x => x.other && x.other.id === id); if (parent) paint(parent.id); }
  hotSnap();
});
panel.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "radio"){
    S.data[t.name] = t.value; S.touched[t.name] = true;
    const f = FIELDS[t.name];
    if (f.other){
      const o = panel.querySelector('[data-other="' + f.id + '"]');
      const show = t.value === f.other.when;
      if (o.hidden && show){ o.hidden = false; o.classList.remove("reveal"); void o.offsetWidth; o.classList.add("reveal"); setTimeout(() => $("#f-" + f.other.id).focus(), 80); }
      else if (!show) o.hidden = true;
    }
    paint(t.name);
  } else if (t.tagName === "SELECT"){ S.touched[t.dataset.in] = true; paint(t.dataset.in); }
  else if (t.dataset.ver){ S.ver[t.dataset.ver] = t.checked; refreshSummaryActions(); }
  hotSnap();
});
panel.addEventListener("focusout", e => {
  const id = e.target.dataset && e.target.dataset.in;
  if (id && FIELDS[id] && (S.data[id]||"").trim()){ S.touched[id] = true; paint(id); }
});
panel.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT" || e.target.type === "radio" || e.target.type === "checkbox") return;
  const form = $("#stepForm"); if (!form) return;
  e.preventDefault();
  const els = Array.from(form.querySelectorAll("input:not([type=radio]),select")).filter(x => !x.closest("[hidden]"));
  const i = els.indexOf(e.target);
  if (i > -1 && i < els.length - 1) els[i+1].focus(); else submitStep();
});
panel.addEventListener("submit", e => { e.preventDefault(); submitStep(); });
panel.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.mode){ S.mode = t.dataset.mode; S.idx = -1; S.max = -1; go(0, "fwd"); }
  else if (t.hasAttribute("data-back")){ if (S.idx === 0){ S.idx = -1; render("back"); } else go(S.idx - 1, "back"); }
  else if (t.dataset.go !== undefined){ go(+t.dataset.go, "back"); }
  else if (t.dataset.same){ const f = FIELDS[t.dataset.same]; S.data[f.id] = S.data[f.sameAs]; const inp = $("#f-" + f.id); inp.value = S.data[f.id]; S.touched[f.id] = true; paint(f.id); }
  else if (t.dataset.quick){ const f = FIELDS[t.dataset.quick]; S.data[f.id] = f.quick.value; $("#f-" + f.id).value = f.quick.value; S.touched[f.id] = true; paint(f.id); }
  else if (t.hasAttribute("data-example")){ S = { mode:"emi", idx:FLOW.emi.length-1, max:FLOW.emi.length-1, data:Object.assign({}, EXAMPLE), touched:{}, example:true, ver:{id:true, tc:true}, confirmReset:false }; render("fwd"); }
  else if (t.hasAttribute("data-clear-example")){ resetAll(false); }
  else if (t.hasAttribute("data-continue")){ S.mode = "emi"; S.max = -1; go(FLOW.emi.indexOf("cliente"), "fwd"); }
  else if (t.hasAttribute("data-reset")){ S.confirmReset = true; render(); }
  else if (t.hasAttribute("data-reset-no")){ S.confirmReset = false; render(); }
  else if (t.hasAttribute("data-reset-yes")){ resetAll(true); }
  else if (t.id === "waBtn"){
    if (S.mode === "emi" && !(S.ver.id && S.ver.tc)){ e.preventDefault(); $("#gateMsg").textContent = "Marca las dos casillas de verificación antes de enviar."; return; }
    $("#okMsg").textContent = "Se abrió WhatsApp con el mensaje listo. Elige el chat y envíalo. Si no se abre, usa Copiar mensaje.";
  }
  else if (t.id === "copyBtn"){
    if (S.mode === "emi" && !(S.ver.id && S.ver.tc)){ $("#gateMsg").textContent = "Marca las dos casillas de verificación antes de copiar."; return; }
    const msg = buildMessage();
    const done = () => { $("#okMsg").textContent = "Mensaje copiado. Pégalo en el chat de WhatsApp."; };
    const fallback = () => {
      const d = $("details.preview"); d.open = true;
      const r = document.createRange(); r.selectNodeContents($("#msgPre"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      $("#okMsg").textContent = "Texto seleccionado: cópialo con Copiar del menú de tu teléfono o Ctrl+C.";
    };
    try { navigator.clipboard.writeText(msg).then(done, fallback); } catch(err){ fallback(); }
  }
});
$("#track").addEventListener("click", e => {
  const b = e.target.closest(".stop.reach,.stop.done"); if (!b || !S.mode) return;
  const i = +b.dataset.go; if (i !== S.idx && i <= S.max) go(i, i < S.idx ? "back" : "fwd");
});

/* ===================== Hot reload ===================== */
function hotSnap(){}
function start(saved){
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => S); } catch(e){}
  if (saved && saved.data){ S = Object.assign(S, saved); }
  else loadAgent();
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || null);
})();
</script>
